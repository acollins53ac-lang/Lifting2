<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="theme-color" content="#0a0a0b">
<title>Lift</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#0a0a0b;
  --surface:#141416;
  --surface-2:#1c1c1f;
  --surface-3:#252529;
  --line:#2a2a2e;
  --line-soft:#212124;
  --txt:#f2f2f3;
  --txt-2:#a1a1a8;
  --txt-3:#6b6b73;
  --accent:#c8f542;
  --accent-dim:#96b832;
  --accent-ink:#0a0a0b;
  --warn:#f5a742;
  --bad:#f26060;
  --blue:#5aa9f5;
  --r-sm:10px; --r:14px; --r-lg:20px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --nav-h:58px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior-y:none}
body{
  background:var(--bg);color:var(--txt);font-family:var(--font);
  font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + var(--safe-bot));
}
/* lift the page so the floating rest timer never covers the action buttons */
body.timer-on{padding-bottom:calc(var(--nav-h) + var(--safe-bot) + 76px)}
input,button,select,textarea{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;outline:none}
button{cursor:pointer}
::-webkit-scrollbar{display:none}

/* ============================================================
   LAYOUT
   ============================================================ */
.view{display:none;padding:0 16px 28px;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.top{padding:calc(var(--safe-top) + 18px) 0 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.9px;line-height:1.1}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--txt-3);margin-bottom:3px}

.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.card-h h2{font-size:15px;font-weight:700;letter-spacing:-.2px}
.sub{font-size:13px;color:var(--txt-2);line-height:1.5}
.mut{color:var(--txt-3)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:0 20px;border-radius:var(--r);
  background:var(--surface-2);border:1px solid var(--line);
  font-size:16px;font-weight:600;letter-spacing:-.2px;width:100%;
  transition:transform .1s,background .15s;
}
.btn:active{transform:scale(.975)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#3a2222}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;border-radius:var(--r-sm);width:auto}
.btn.xs{min-height:32px;font-size:13px;padding:0 11px;border-radius:9px;width:auto;font-weight:600}
.btn[disabled]{opacity:.35;pointer-events:none}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* ============================================================
   BOTTOM NAV
   ============================================================ */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  height:calc(var(--nav-h) + var(--safe-bot));
  padding-bottom:var(--safe-bot);
  background:rgba(14,14,16,.86);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line-soft);
  display:flex;
}
nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--txt-3);font-size:10px;font-weight:600;letter-spacing:.2px;
}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}

/* ============================================================
   HOME
   ============================================================ */
.hero{
  background:linear-gradient(160deg,var(--surface-2),var(--surface));
  border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:12px;
}
.hero .tag{
  display:inline-flex;align-items:center;gap:6px;background:rgba(200,245,66,.1);
  color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  padding:5px 10px;border-radius:99px;margin-bottom:12px;
}
.hero h2{font-size:26px;font-weight:800;letter-spacing:-.7px;margin-bottom:4px}
.hero .meta{font-size:13.5px;color:var(--txt-2);margin-bottom:16px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:13px 12px}
.stat b{display:block;font-size:23px;font-weight:800;letter-spacing:-.7px;margin-bottom:1px}
.stat span{font-size:10.5px;color:var(--txt-3);font-weight:600;letter-spacing:.5px;text-transform:uppercase}

.dots{display:flex;gap:5px;justify-content:space-between}
.dot{flex:1;aspect-ratio:1;max-width:20px;border-radius:6px;background:var(--surface-3)}
.dot.a{background:var(--accent)}
.dot.b{background:var(--warn)}
.dot.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--txt-3)}

.blockbar{display:flex;gap:5px;margin-top:12px}
.wk{flex:1;height:5px;border-radius:99px;background:var(--surface-3)}
.wk.done{background:var(--accent-dim)}
.wk.now{background:var(--accent)}
.wk.deload{background:var(--blue)}

/* ============================================================
   EXERCISE LIST
   ============================================================ */
.ex{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-bottom:1px solid var(--line-soft);
}
.ex:last-child{border-bottom:none}
.ex:active{background:var(--surface-2)}
.ex-n{
  width:27px;height:27px;flex:none;border-radius:9px;background:var(--surface-3);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--txt-2);
}
.ex-n.done{background:var(--accent);color:var(--accent-ink)}
.ex-b{flex:1;min-width:0}
.ex-b h3{font-size:15px;font-weight:600;letter-spacing:-.2px;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-b p{font-size:12.5px;color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-b p .hl{color:var(--txt-2)}
.chev{color:var(--txt-3);flex:none}

.slot-tag{
  font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  color:var(--txt-3);background:var(--surface-3);padding:2px 6px;border-radius:5px;
  display:inline-block;margin-bottom:5px;
}
.slot-tag.anchor{color:var(--accent);background:rgba(200,245,66,.09)}

/* ============================================================
   SET LOGGING
   ============================================================ */
.target{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;margin-bottom:12px;
}
.target .big{font-size:19px;font-weight:700;letter-spacing:-.4px;margin-bottom:3px}
.target .why{font-size:12.5px;color:var(--txt-3);line-height:1.5}

.setrow{
  display:flex;align-items:center;gap:8px;padding:9px 0;
  border-bottom:1px solid var(--line-soft);
}
.setrow:last-of-type{border-bottom:none}
.setrow .idx{width:26px;flex:none;font-size:12.5px;font-weight:700;color:var(--txt-3)}
.fld{
  flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:11px 12px;display:flex;align-items:baseline;gap:6px;min-width:0;
}
.fld input{width:100%;font-size:18px;font-weight:700;letter-spacing:-.4px;
  font-variant-numeric:tabular-nums;min-width:0}
.fld input::placeholder{color:var(--txt-3);font-weight:600}
.fld label{font-size:11px;color:var(--txt-3);font-weight:600;flex:none}
.fld.filled{border-color:var(--accent-dim);background:rgba(200,245,66,.05)}
.tick{
  width:44px;height:44px;flex:none;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--txt-3);
}
.tick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tick svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   REST TIMER
   ============================================================ */
.timer{
  position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--safe-bot) + 12px);
  z-index:55;background:var(--surface-3);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 16px;
  display:none;align-items:center;gap:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
.timer.on{display:flex}
.timer .t{font-size:26px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;min-width:74px}
.timer .t.done{color:var(--accent)}
.timer .lbl{flex:1;font-size:12px;color:var(--txt-3);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.timer .bar{position:absolute;left:0;bottom:0;height:2.5px;background:var(--accent);
  border-radius:0 0 var(--r) var(--r);transition:width 1s linear}

/* ============================================================
   SHEET (swap / detail)
   ============================================================ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;opacity:0;
  pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:90;
  background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;
  border-top:1px solid var(--line);
  max-height:86vh;overflow-y:auto;
  padding:8px 16px calc(20px + var(--safe-bot));
  transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:99px;background:var(--surface-3);margin:6px auto 14px}
.sheet h2{font-size:19px;font-weight:800;letter-spacing:-.5px;margin-bottom:3px}

.chips{display:flex;gap:6px;overflow-x:auto;margin:12px -16px;padding:0 16px 2px}
.chip{
  flex:none;padding:8px 13px;border-radius:99px;background:var(--surface-2);
  border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--txt-2);
}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.alt{
  display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:7px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
}
.alt:active{background:var(--surface-3)}
.alt-b{flex:1;min-width:0}
.alt-b h4{font-size:15px;font-weight:600;letter-spacing:-.2px;margin-bottom:2px}
.alt-b p{font-size:12px;color:var(--txt-3)}
.pill{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:3px 7px;border-radius:6px;background:var(--surface-3);color:var(--txt-3);flex:none}
.pill.cur{background:rgba(200,245,66,.12);color:var(--accent)}
.pill.hist{background:rgba(90,169,245,.12);color:var(--blue)}

/* ============================================================
   MISC
   ============================================================ */
.banner{
  background:rgba(200,245,66,.07);border:1px solid rgba(200,245,66,.22);
  border-radius:var(--r);padding:13px 15px;margin-bottom:12px;
  display:flex;align-items:center;gap:12px;
}
.banner p{font-size:13.5px;font-weight:600;flex:1}
.empty{text-align:center;padding:44px 20px;color:var(--txt-3)}
.empty svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:1.4;margin-bottom:12px;opacity:.5}
.empty p{font-size:14px;line-height:1.6}

.wchart{width:100%;height:150px;display:block;margin:4px 0 2px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;padding:9px 0;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--txt-2)}
.seg button.on{background:var(--surface-3);color:var(--txt)}

.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.li:last-child{border-bottom:none}
.li-b{flex:1;min-width:0}
.li-b h3{font-size:14.5px;font-weight:600;margin-bottom:2px}
.li-b p{font-size:12.5px;color:var(--txt-3)}
.badge{width:30px;height:30px;flex:none;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:800}
.badge.a{background:rgba(200,245,66,.13);color:var(--accent)}
.badge.b{background:rgba(245,167,66,.13);color:var(--warn)}

.toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  border-bottom:1px solid var(--line-soft)}
.toggle:last-child{border-bottom:none}
.toggle span{font-size:14.5px;font-weight:500}
.sw{width:48px;height:29px;border-radius:99px;background:var(--surface-3);position:relative;
  flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:99px;
  background:#fff;transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(19px)}

.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-bot) + 20px);
  transform:translate(-50%,14px);z-index:200;
  background:var(--surface-3);border:1px solid var(--line);border-radius:99px;
  padding:11px 20px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .22s;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<section class="view on" id="v-home">
  <div class="top">
    <div><div class="eyebrow" id="h-date">—</div><h1>Today</h1></div>
  </div>
  <div id="h-body"></div>
</section>

<!-- ============ TRAIN ============ -->
<section class="view" id="v-train">
  <div id="t-body"></div>
</section>

<!-- ============ PROGRAM ============ -->
<section class="view" id="v-prog">
  <div class="top"><div><div class="eyebrow">Slots &amp; pools</div><h1>Program</h1></div></div>
  <div class="seg" id="p-seg">
    <button class="on" data-day="A">Lift A</button>
    <button data-day="B">Lift B</button>
  </div>
  <div id="p-body"></div>
</section>

<!-- ============ BODY ============ -->
<section class="view" id="v-body">
  <div class="top"><div><div class="eyebrow">Wednesday weigh-in</div><h1>Body</h1></div></div>
  <div id="b-body"></div>
</section>

<!-- ============ HISTORY ============ -->
<section class="view" id="v-hist">
  <div class="top"><div><div class="eyebrow">Every session</div><h1>History</h1></div></div>
  <div class="seg" id="hi-seg">
    <button class="on" data-f="all">All</button>
    <button data-f="A">Lift A</button>
    <button data-f="B">Lift B</button>
  </div>
  <div id="hi-body"></div>
</section>

<!-- ============ SETTINGS ============ -->
<section class="view" id="v-set">
  <div class="top"><div><div class="eyebrow">Data &amp; preferences</div><h1>Settings</h1></div></div>
  <div id="s-body"></div>
</section>

<!-- ============ REST TIMER ============ -->
<div class="timer" id="timer">
  <div class="t num" id="timer-t">0:00</div>
  <div class="lbl" id="timer-l">Rest</div>
  <button class="btn xs ghost" id="timer-add">+30s</button>
  <button class="btn xs" id="timer-skip">Skip</button>
  <div class="bar" id="timer-bar" style="width:100%"></div>
</div>

<!-- ============ SHEET ============ -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheet-body"></div></div>

<div class="toast" id="toast"></div>

<!-- ============ NAV ============ -->
<nav id="nav">
  <button class="on" data-v="home">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    <span>Home</span></button>
  <button data-v="train">
    <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>
    <span>Train</span></button>
  <button data-v="prog">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>Program</span></button>
  <button data-v="body">
    <svg viewBox="0 0 24 24"><path d="M4 17l5-6 4 4 7-8"/></svg>
    <span>Body</span></button>
  <button data-v="hist">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    <span>History</span></button>
</nav>

<script>
"use strict";
/* ============================================================
   Lift v2 — session-driven program, delegated events.
   Design rules that keep this stable:
   1. Program position derives ONLY from completed-session count.
      No dates, no drift when life moves a workout.
   2. One permanent click listener routes every tap through
      ACTIONS. Buttons can never exist without a live handler.
   3. Renders never throw the app dead: guard() wraps them and
      window.onerror catches anything that slips through.
   4. Set data is positional and null-safe; nulls are expected.
   ============================================================ */

/* ---------- 1. STORAGE ---------- */
const DB_NAME='lift', DB_VER=1, SCHEMA_VERSION=3;
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('sessions')){
        const s=d.createObjectStore('sessions',{keyPath:'id'});
        s.createIndex('date','date');
      }
      if(!d.objectStoreNames.contains('bodyweights'))
        d.createObjectStore('bodyweights',{keyPath:'date'});
      if(!d.objectStoreNames.contains('kv'))
        d.createObjectStore('kv',{keyPath:'key'});
    };
    r.onsuccess=()=>{db=r.result;res()};
    r.onerror=()=>rej(r.error);
  });
}
const tx=(st,m)=>db.transaction(st,m).objectStore(st);
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvGet=async(k,d)=>{const v=await req(tx('kv','readonly').get(k));return v===undefined?d:v.val};
const kvSet=(k,val)=>req(tx('kv','readwrite').put({key:k,val})).catch(e=>console.error('kvSet',k,e));
const allSessions=()=>req(tx('sessions','readonly').getAll());
const putSession=s=>req(tx('sessions','readwrite').put(s));
const delSession=id=>req(tx('sessions','readwrite').delete(id));
const allWeights=()=>req(tx('bodyweights','readonly').getAll());
const putWeight=w=>req(tx('bodyweights','readwrite').put(w));
const delWeight=d=>req(tx('bodyweights','readwrite').delete(d));

/* ---------- 2. EXERCISE LIBRARY ---------- */
const EQUIP={db:'Dumbbell',cable:'Cable',machine:'Machine',bar:'Barbell',bw:'Bodyweight',smith:'Smith'};
const LIB={
  inc_db_press:{n:'Incline DB Press (30°)',e:'db',b:5},
  flat_db_press:{n:'Flat DB Press',e:'db',b:5},
  inc_mach_press:{n:'Incline Machine Press',e:'machine',b:10},
  chest_press_mach:{n:'Seated Chest Press',e:'machine',b:10},
  inc_bb_press:{n:'Incline Barbell Press',e:'bar',b:5},
  weighted_dip:{n:'Weighted Dip',e:'bw',b:5},
  smith_inc_press:{n:'Smith Incline Press',e:'smith',b:10},
  cable_fly_mid:{n:'Cable Fly (mid)',e:'cable',b:5},
  cable_fly_low:{n:'Low-to-High Cable Fly',e:'cable',b:5},
  cable_fly_high:{n:'High-to-Low Cable Fly',e:'cable',b:5},
  pec_deck:{n:'Pec Deck',e:'machine',b:10},
  inc_db_fly:{n:'Incline DB Fly',e:'db',b:2.5},
  bulgarian:{n:'Bulgarian Split Squat',e:'db',b:5},
  walking_lunge:{n:'Walking Lunge',e:'db',b:5},
  reverse_lunge:{n:'Reverse Lunge',e:'db',b:5},
  step_up:{n:'Dumbbell Step-Up',e:'db',b:5},

/* ---------- 4. ENGINE — session count is the only clock ---------- */
const DAY_MS=86400000;
const iso=d=>{const x=new Date(d);x.setHours(12,0,0,0);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso(new Date());
const parseISO=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y||2000,(m||1)-1,d||1,12)};
const fmtDate=d=>parseISO(d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const weekStart=ds=>{const d=parseISO(ds);const sh=(d.getDay()+6)%7;return iso(new Date(d.getTime()-sh*DAY_MS))};
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/DAY_MS);

let ST={};

/* Your place in the program: N completed sessions.
   3 sessions = 1 program week. 4 program weeks = 1 block. */
function pos(){
  const n=ST.sessions.length;
  const week=Math.floor(n/3);
  const deload=ST.deloads.includes(week);
  return {
    n, weekIndex:week,
    sessionInWeek:n%3+1,
    weekInBlock:week%4+1,
    block:Math.floor(week/4),
    deload,
    wave:deload?DELOAD:WAVE[week%4],
  };
}
/* Suggestion is simply the opposite of whatever came last. */
const suggestDay=()=>{
  const last=ST.sessions[ST.sessions.length-1];
  return last && last.day==='A' ? 'B' : 'A';
};
function resolveExercise(slot,info){
  const pin=ST.pins[slot.id];
  if(pin && LIB[pin]) return pin;
  const p=slot.pool;
  const i=slot.anchor
    ? info.block % p.length
    : (info.block*2 + (info.weekInBlock>=3?1:0)) % p.length;
  return p[i];
}
function buildWorkout(dayKey){
  const info=pos();
  const day=PROGRAM[dayKey];
  return {
    date:today(), day:dayKey, info,
    name:day.name, focus:day.focus,
    exercises:day.slots.map(slot=>{
      const exId=resolveExercise(slot,info);
      return {
        slotId:slot.id, tag:slot.tag, anchor:slot.anchor, uni:slot.uni||false,
        exId, name:LIB[exId]?LIB[exId].n:exId,
        sets:info.deload?Math.max(2,slot.sets-1):slot.sets,
        lo:info.wave.lo, hi:info.wave.hi,
        rest:info.deload?Math.round(slot.rest*.8):slot.rest,
        logged:[],
      };
    })
  };
}

/* ---------- sets are positional and may contain nulls ---------- */
const setsOf=e=>((e&&e.logged)||[]).filter(x=>x&&typeof x.weight==='number'&&typeof x.reps==='number');
const doneCount=e=>setsOf(e).length;
const est1rm=s=>s?Math.round(s.weight*(1+s.reps/30)):0;
const best=sets=>sets.reduce((b,s)=>{
  const v=(s.weight||0)*(1+(s.reps||0)/30);
  return v>b.v?{v,set:s}:b;
},{v:0,set:null}).set;

function lastPerformance(exId){
  for(let i=ST.sessions.length-1;i>=0;i--){
    const e=(ST.sessions[i].exercises||[]).find(x=>x.exId===exId && doneCount(x));
    if(e) return {sets:setsOf(e),date:ST.sessions[i].date};
  }
  return null;
}
function slotHistory(slotId){
  const out=[];
  ST.sessions.forEach(s=>(s.exercises||[]).forEach(e=>{
    if(e.slotId===slotId && doneCount(e)) out.push({date:s.date,exId:e.exId,sets:setsOf(e)});
  }));
  return out;
}
function suggest(ex){
  const last=lastPerformance(ex.exId);
  if(!last) return {text:'First time — find a weight you can control for '+ex.lo+'–'+ex.hi+'.',w:null};
  const bump=LIB[ex.exId]?LIB[ex.exId].b:5;
  const w=last.sets[0].weight||0;
  const cleared=last.sets.every(s=>(s.reps||0)>=ex.hi);
  const summary=last.sets.map(s=>s.reps).join(', ');
  if(cleared) return {text:'Last: '+w+' × '+summary+' — cleared it. Go '+(w+bump)+' × '+ex.lo+'.',w:w+bump};
  return {text:'Last: '+w+' × '+summary+'. Target '+w+' × '+ex.hi+' across.',w:w};
}

let toastT;
function toast(msg){
  const t=el('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1900);
}
function buzz(p){ try{ if(ST.settings.haptic&&navigator.vibrate) navigator.vibrate(p); }catch(e){} }
let audioCtx;
function beep(){
  if(!ST.settings.sound) return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    [0,180,360].forEach((d,i)=>setTimeout(()=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.connect(g);g.connect(audioCtx.destination);
      o.frequency.value=i===2?1050:780;o.type='sine';
      g.gain.setValueAtTime(.0001,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.25,audioCtx.currentTime+.01);
      g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.28);
      o.start();o.stop(audioCtx.currentTime+.3);
    },d));
  }catch(e){}
}
function showSheet(html){ el('sheet-body').innerHTML=html;
  el('sheet').classList.add('on'); el('scrim').classList.add('on'); }

function sparkline(pts,unit){
  if(!pts||pts.length<2) return '<p class="sub mut">Log two sessions to see a trend.</p>';
  const W=320,H=150,P=22;
  const vs=pts.map(p=>p.v);
  const min=Math.min(...vs),max=Math.max(...vs),span=(max-min)||1;
  const x=i=>P+i*(W-2*P)/(pts.length-1);
  const y=v=>H-P-((v-min)/span)*(H-2*P);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const area=line+` L${x(pts.length-1).toFixed(1)} ${H-P} L${P} ${H-P} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="var(--accent)"/>`).join('');
  return `<svg class="wchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity=".22"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#g1)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>
  <div class="sub mut" style="display:flex;justify-content:space-between;font-size:11.5px">
    <span>${fmtDate(pts[0].date)} · ${Math.round(min)}${unit||''}</span>
    <span>${fmtDate(pts[pts.length-1].date)} · ${Math.round(pts[pts.length-1].v)}${unit||''}</span></div>`;
}

const PANES={home:'h-body',train:'t-body',prog:'p-body',body:'b-body',hist:'hi-body',set:'s-body'};

function crashCard(err){

}
function guard(name,fn){
  try{ fn(); }
  catch(err){
    console.error('render',name,err);
    const pane=el(PANES[name]); if(pane) pane.innerHTML=crashCard(err);
  }
}

function go(v){
  curView=v;

  el('v-'+v).classList.add('on');

/* ---------- 6. REST TIMER ---------- */
let timerEnd=0,timerTotal=0,timerInt=null;
function startTimer(sec){
  timerEnd=Date.now()+sec*1000; timerTotal=sec;
  kvSet('timer',{end:timerEnd,total:sec});
  el('timer').classList.add('on'); document.body.classList.add('timer-on');
  tickTimer(); clearInterval(timerInt); timerInt=setInterval(tickTimer,250);
}
function tickTimer(){
  const left=Math.max(0,Math.round((timerEnd-Date.now())/1000));
  const t=el('timer-t');
  t.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  el('timer-bar').style.width=(timerTotal?100*left/timerTotal:0)+'%';
  if(left<=0){
    if(!t.classList.contains('done')){
      t.classList.add('done'); el('timer-l').textContent='Go';
      beep(); buzz([180,90,180]);
    }
  }else{ t.classList.remove('done'); el('timer-l').textContent='Rest'; }
  if(left<=0 && Date.now()-timerEnd>12000) stopTimer();
}
function stopTimer(){
  clearInterval(timerInt); timerInt=null; timerEnd=0;
  el('timer').classList.remove('on'); el('timer-t').classList.remove('done');
  document.body.classList.remove('timer-on');
  kvSet('timer',null);
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&timerEnd) tickTimer(); });

/* ---------- 7. STATE MUTATIONS ---------- */
let openEx=null, swapFilter='all', progDay='A', histFilter='all';
const saveActive=()=>kvSet('active',ST.active);

async function finishWorkout(){
  const w=ST.active; if(!w) return;
  const logged=w.exercises.filter(e=>doneCount(e)>0);
  if(!logged.length){ toast('Nothing logged yet'); return; }
  const info=pos();
  const sess={
    id:Date.now(), date:w.date, day:w.day,
    block:info.block, weekInBlock:info.weekInBlock,
    deload:info.deload, wave:info.wave.label,
    exercises:logged.map(e=>({slotId:e.slotId,tag:e.tag,exId:e.exId,name:e.name,logged:setsOf(e)})),
  };
  try{ await putSession(sess); }
  catch(err){ console.error(err); toast('Could not save — try again'); return; }
  ST.sessions.push(sess);
  ST.active=null; openEx=null; saveActive(); stopTimer();
  const vol=logged.reduce((t,e)=>t+setsOf(e).reduce((x,s)=>x+s.weight*s.reps,0),0);
  toast('Logged · '+Math.round(vol).toLocaleString()+' lbs volume');
  go('home');
}

  const other=sug==='A'?'B':'A';
  const active=ST.active;

  const weekCount=ST.sessions.filter(s=>weekStart(s.date)===weekStart(t)).length;
  const last=ST.sessions[ST.sessions.length-1];

  let dots='';
  for(let i=13;i>=0;i--){

    dots+=`<div class="dot ${s?s.day.toLowerCase():''} ${d===t?'today':''}"></div>`;
  }

        · Session ${info.sessionInWeek} of 3</div>

    </div>`;

  el('h-body').innerHTML+=`
    <div class="stats">
      <div class="stat"><b class="num">${ST.sessions.length}</b><span>Sessions</span></div>
      <div class="stat"><b class="num">${weekCount}/3</b><span>This week</span></div>

      <div class="card-h"><h2>This week's focus</h2></div>
      <p class="sub">${esc(info.wave.note)} The program moves with your sessions — miss a day and nothing shifts, just pick up where you left off.</p>
    </div>`;
}

  }).join('');

  el('t-body').innerHTML=`

      <div><div class="eyebrow">${esc(w.info.deload?'Deload':'Week '+w.info.weekInBlock+' · '+w.info.wave.label)}</div>

}

function renderExLog(w,i){
  const e=w.exercises[i];
  const s=suggest(e);
  const rows=[];
  for(let k=0;k<e.sets;k++){
    const L=e.logged[k];
    rows.push(`<div class="setrow" data-k="${k}">
      <div class="idx">${k+1}</div>
      <div class="fld ${L?'filled':''}">
        <input type="number" inputmode="decimal" step="0.5" class="w"
          placeholder="${s.w!==null?s.w:'—'}" value="${L?L.weight:''}"><label>lbs</label></div>
      <div class="fld ${L?'filled':''}">
        <input type="number" inputmode="numeric" class="r"
          placeholder="${e.hi}" value="${L?L.reps:''}"><label>reps</label></div>
      <button class="tick ${L?'on':''}" data-a="tick" data-k="${k}">${CHECK}</button>
    </div>`);
  }

  el('t-body').innerHTML=`
    <div class="top">

      <div class="why">${esc(s.text)}</div>
    </div>
    <div class="row" style="margin-bottom:14px">
      <button class="btn sm" data-a="swap-open">Swap exercise</button>

    ${hist.length?`<div class="card">
      <div class="card-h"><h2>Slot trend</h2><span class="sub mut">e1RM, all variants</span></div>
      ${sparkline(hist.map(h=>({date:h.date,v:est1rm(best(h.sets))})))}
    </div>`:''}
    <button class="btn primary" data-a="next-ex">Done — next exercise</button>

}

function renderProgram(){
  const info=pos();
  const day=PROGRAM[progDay];
  const rows=day.slots.map(slot=>{
    const cur=resolveExercise(slot,info);
    const nextInfo={...info,weekInBlock:info.weekInBlock>=3?1:3,
                    block:info.weekInBlock>=3?info.block+1:info.block};
    const nxt=resolveExercise(slot,nextInfo);
    const pinned=!!ST.pins[slot.id];
    return `<div class="ex" data-a="slot-open" data-slot="${slot.id}">
      <div class="ex-b">
        <div class="slot-tag ${slot.anchor?'anchor':''}">${esc(slot.tag)}${slot.anchor?' · anchor':' · rotates'}</div>
        <h3>${esc(LIB[cur].n)}${pinned?' 📌':''}</h3>
        <p>${slot.sets}×${info.wave.lo}–${info.wave.hi} · ${slot.rest}s${pinned?' · pinned':(nxt!==cur?' · next: '+esc(LIB[nxt].n):'')}</p>
      </div>${CHEV}</div>`;
  }).join('');
  el('p-body').innerHTML=`
    <div class="card" style="padding:14px 16px">
      <div class="card-h" style="margin:0"><h2>${esc(day.focus)}</h2>
        <span class="sub mut">Block ${info.block+1} · Wk ${info.weekInBlock}</span></div>
    </div>
    <div class="card pad0">${rows}</div>
    <div class="card">
      <div class="card-h"><h2>How rotation works</h2></div>
      <p class="sub">Anchors hold for a four-week block so progression stays measurable, then
      shift to a related variant. Other slots swap at week three. A program week is three
      completed sessions — the calendar doesn't matter. Pin any slot to freeze it.</p>
    </div>`;
}

    <div class="card">
      <div class="card-h"><h2>${thisWeek?'Update this week':'Log weigh-in'}</h2>

    ${rows?`<div class="card pad0">${rows}</div>`

        <p>No weigh-ins yet.<br>Wednesdays work well — same time, same conditions.</p></div>`}`;
}

function renderHistory(){

  el('hi-body').innerHTML=`<div class="card pad0">${rows}</div>`;
}

/* ---------- 9. SHEETS ---------- */
function openSwap(){
  const w=ST.active; if(!w||openEx===null) return;
  const e=w.exercises[openEx];
  const slot=PROGRAM[w.day].slots.find(s=>s.id===e.slotId);
  if(!slot) return;
  const recent=ST.sessions.slice(-6).flatMap(s=>(s.exercises||[]).map(x=>x.exId));
  const cands=slot.pool
    .filter(id=>swapFilter==='all'||(LIB[id]&&LIB[id].e===swapFilter))
    .map(id=>{
      const h=lastPerformance(id);
      return {id,...LIB[id],hist:h,
        score:(id===e.exId?-100:0)+(h?12:0)-(recent.includes(id)?6:0)};
    })
    .sort((a,b)=>b.score-a.score);
  const equips=[...new Set(slot.pool.map(id=>LIB[id]&&LIB[id].e).filter(Boolean))];
  const chips=['all',...equips].map(k=>
    `<button class="chip ${swapFilter===k?'on':''}" data-a="swap-filter" data-eq="${k}">${k==='all'?'All':EQUIP[k]}</button>`).join('');
  const list=cands.map(c=>`
    <div class="alt" data-a="swap-to" data-id="${c.id}">
      <div class="alt-b"><h4>${esc(c.n)}</h4>
        <p>${EQUIP[c.e]}${c.hist?' · last '+c.hist.sets[0].weight+' lbs × '+c.hist.sets[0].reps:' · no history'}</p></div>
      ${c.id===e.exId?'<span class="pill cur">Current</span>':c.hist?'<span class="pill hist">Logged</span>':''}
    </div>`).join('');
  showSheet(`
    <h2>Swap ${esc(slot.tag)}</h2>
    <p class="sub">Same movement pattern, so your slot history stays comparable.</p>
    <div class="chips">${chips}</div>
    ${list||'<p class="sub mut" style="padding:16px 0">Nothing in this pool matches that equipment.</p>'}
    <div class="row" style="margin-top:14px">
      <button class="btn sm ghost" data-a="swap-pin">Pin as default</button>
      <button class="btn sm ghost" data-a="sheet-close">Cancel</button>
    </div>
    <p class="sub mut" style="margin-top:10px;font-size:12px">Pinning locks this slot to the current exercise and stops rotation for it.</p>`);
}

function openSlotSheet(slotId){
  const info=pos();
  const slot=PROGRAM[progDay].slots.find(s=>s.id===slotId);
  if(!slot) return;
  const cur=resolveExercise(slot,info);
  const hist=slotHistory(slotId);
  const pinned=ST.pins[slotId];
  const pool=slot.pool.map(id=>{
    const h=lastPerformance(id);
    return `<div class="alt" data-a="slot-pin" data-slot="${slotId}" data-id="${id}">
      <div class="alt-b"><h4>${esc(LIB[id].n)}</h4>
      <p>${EQUIP[LIB[id].e]}${h?' · '+h.sets.length+' sets logged '+fmtDate(h.date):''}</p></div>
      ${id===cur?'<span class="pill cur">In rotation</span>':''}
      ${pinned===id?'<span class="pill hist">Pinned</span>':''}
    </div>`;
  }).join('');
  showSheet(`
    <h2>${esc(slot.tag)}</h2>
    <p class="sub">${slot.anchor?'Anchor slot — holds for the block, rotates at the boundary.':'Rotating slot — changes at week three.'}</p>
    ${hist.length>1?`<div style="margin:14px 0">${sparkline(hist.map(h=>({date:h.date,v:est1rm(best(h.sets))})),' e1RM')}</div>`:''}
    <div class="card-h" style="margin:16px 0 8px"><h2>Pool</h2><span class="sub mut">Tap to pin</span></div>
    ${pool}
    ${pinned?`<button class="btn sm ghost" data-a="slot-unpin" data-slot="${slotId}" style="width:100%;margin-top:12px">Unpin — resume rotation</button>`:''}`);
}

function openSession(id){
  const s=ST.sessions.find(x=>x.id===id); if(!s) return;
  const body=(s.exercises||[]).map(e=>`
    <div class="ex" data-a="ex-chart" data-ex="${e.exId}">
      <div class="ex-b">
        <div class="slot-tag">${esc(e.tag||'')}</div>
        <h3>${esc(e.name)}</h3>
        <p class="num">${setsOf(e).map(l=>l.weight+' × '+l.reps).join('   ')}</p>
      </div>${CHEV}</div>`).join('');
  showSheet(`
    <h2>${fmtDate(s.date)}</h2>
    <p class="sub">${PROGRAM[s.day]?PROGRAM[s.day].name:'—'} · ${esc(s.wave||'')}${s.deload?' · deload':''} · Block ${(s.block??0)+1} Wk ${s.weekInBlock??'—'}</p>
    <div class="card pad0" style="margin-top:14px">${body}</div>
    <button class="btn sm danger" data-a="sess-del" data-id="${id}" style="width:100%">Delete session</button>`);
}

function openExerciseChart(exId){
  const pts=[];
  ST.sessions.forEach(s=>(s.exercises||[]).forEach(e=>{
    if(e.exId===exId&&doneCount(e)) pts.push({date:s.date,v:est1rm(best(setsOf(e)))});
  }));
  showSheet(`
    <h2>${esc(LIB[exId]?LIB[exId].n:exId)}</h2>
    <p class="sub">Best set per session, as estimated 1RM.</p>
    <div style="margin-top:16px">${sparkline(pts,' lbs')}</div>
    <button class="btn sm ghost" data-a="sheet-close" style="width:100%;margin-top:14px">Close</button>`);
}

/* ---------- 10. ACTIONS — the single routing table ---------- */
function tickSet(t){
  const w=ST.active; if(!w||openEx===null) return;
  const e=w.exercises[openEx];
  const row=t.closest('.setrow'); if(!row) return;
  const k=+row.dataset.k;
  const wIn=row.querySelector('.w'), rIn=row.querySelector('.r');

  if(e.logged[k]){                       // un-log: blank the slot, keep positions
    e.logged[k]=null; saveActive();
    t.classList.remove('on');
    row.querySelectorAll('.fld').forEach(f=>f.classList.remove('filled'));
    updateLogHeader(e); return;
  }
  const wv=parseFloat(wIn.value), rv=parseInt(rIn.value,10);
  if(!Number.isFinite(wv)||!Number.isFinite(rv)){ toast('Enter weight and reps'); return; }
  if(wv<0||wv>2000){ toast('Check that weight'); return; }
  if(rv<1||rv>200){ toast('Check those reps'); return; }
  while(e.logged.length<e.sets) e.logged.push(null);
  e.logged[k]={weight:wv,reps:rv};
  saveActive(); buzz(28); startTimer(e.rest);
  t.classList.add('on');
  row.querySelectorAll('.fld').forEach(f=>f.classList.add('filled'));
  updateLogHeader(e);
}
function updateLogHeader(e){
  // header count on the list screen is rebuilt on back; nothing else to sync here
}

const ACTIONS={
  'nav':t=>go(t.dataset.v),
  'start':t=>{ if(!ST.active) ST.active=buildWorkout(t.dataset.day);
               saveActive(); openEx=null; go('train'); },
  'resume':()=>{ openEx=null; go('train'); },
  'discard':()=>{ if(confirm('Discard this workout? Logged sets will be lost.')){
      ST.active=null; openEx=null; saveActive(); stopTimer(); go('home'); } },
  'finish':()=>finishWorkout(),
  'open-ex':t=>{ openEx=+t.dataset.i; renderTrain(); window.scrollTo(0,0); },
  'back-list':()=>{ openEx=null; renderTrain(); },
  'next-ex':()=>{ const w=ST.active; if(!w) return;
      const nxt=w.exercises.findIndex((x,j)=>j>openEx&&doneCount(x)<x.sets);
      openEx=nxt>=0?nxt:null; renderTrain(); window.scrollTo(0,0); },
  'tick':t=>tickSet(t),
  'add-set':()=>{ const w=ST.active; if(!w||openEx===null) return;
      w.exercises[openEx].sets++; saveActive(); renderTrain(); },
  'swap-open':()=>{ swapFilter='all'; openSwap(); },
  'swap-filter':t=>{ swapFilter=t.dataset.eq; openSwap(); },
  'swap-to':t=>{ const w=ST.active; if(!w||openEx===null) return;
      const e=w.exercises[openEx]; const id=t.dataset.id; if(!LIB[id]) return;
      e.exId=id; e.name=LIB[id].n; e.logged=[];
      saveActive(); hideSheet(); renderTrain(); toast('Swapped to '+LIB[id].n); },
  'swap-pin':()=>{ const w=ST.active; if(!w||openEx===null) return;
      const e=w.exercises[openEx];
      ST.pins[e.slotId]=e.exId; kvSet('pins',ST.pins);
      hideSheet(); toast(LIB[e.exId].n+' pinned to this slot'); },
  'slot-open':t=>openSlotSheet(t.dataset.slot),
  'slot-pin':t=>{ ST.pins[t.dataset.slot]=t.dataset.id; kvSet('pins',ST.pins);
      hideSheet(); renderProgram(); toast('Pinned '+LIB[t.dataset.id].n); },
  'slot-unpin':t=>{ delete ST.pins[t.dataset.slot]; kvSet('pins',ST.pins);
      hideSheet(); renderProgram(); toast('Rotation resumed'); },
  'sess-open':t=>openSession(+t.dataset.id),
  'sess-del':async t=>{ if(!confirm('Delete this session?')) return;
      const id=+t.dataset.id;
      try{ await delSession(id); }catch(e){ toast('Delete failed'); return; }
      ST.sessions=ST.sessions.filter(x=>x.id!==id);
      hideSheet(); renderHistory(); toast('Deleted'); },
  'ex-chart':t=>openExerciseChart(t.dataset.ex),
  'sheet-close':()=>hideSheet(),
  'wt-save':async()=>{ const v=parseFloat(el('wt').value);
      if(!(v>0)||v>1000){ toast('Enter a valid weight'); return; }
      const t=today();
      const thisWeek=ST.weights.find(w=>weekStart(w.date)===weekStart(t));
      try{ await putWeight({date:thisWeek?thisWeek.date:t,lbs:v}); }
      catch(e){ toast('Save failed'); return; }
      ST.weights=await allWeights(); renderBody(); toast('Weigh-in saved'); },
  'wt-del':async t=>{ try{ await delWeight(t.dataset.d); }catch(e){ toast('Delete failed'); return; }
      ST.weights=await allWeights(); renderBody(); },
  'setting':t=>{ const k=t.dataset.k;
      ST.settings[k]=!ST.settings[k]; kvSet('settings',ST.settings);
      t.classList.toggle('on',ST.settings[k]);
      if(k==='haptic'&&ST.settings[k]) buzz(30);
      if(k==='sound'&&ST.settings[k]) beep(); },
  'deload':()=>{ const info=pos(); const wi=info.weekIndex;
      const on=ST.deloads.includes(wi);
      ST.deloads=on?ST.deloads.filter(x=>x!==wi):[...ST.deloads,wi];
      kvSet('deloads',ST.deloads);
      if(ST.active){
        const keep=ST.active.exercises;
        ST.active=buildWorkout(ST.active.day);
        ST.active.exercises.forEach(e=>{
          const old=keep.find(o=>o.slotId===e.slotId);
          if(old){ e.exId=old.exId; e.name=old.name; e.logged=old.logged; }
        });
        saveActive();
      }
      renderSettings(); toast(on?'Deload cancelled':'Deload week set'); },
  'export':()=>{ const data={
        schema_version:SCHEMA_VERSION, exported_at:new Date().toISOString(),
        settings:ST.settings, deload_weeks:ST.deloads, slot_pins:ST.pins,
        sessions:ST.sessions, body_weights:ST.weights };
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='lift-'+today()+'.json';
      a.click(); URL.revokeObjectURL(a.href); toast('Exported'); },
  'import':()=>el('file').click(),
  'erase':async()=>{ if(!confirm('Erase all sessions, weigh-ins and settings? This cannot be undone.')) return;
      if(!confirm('Really erase everything?')) return;
      try{ await Promise.all([
        req(tx('sessions','readwrite').clear()),
        req(tx('bodyweights','readwrite').clear()),
        req(tx('kv','readwrite').clear())]); }
      catch(e){ toast('Erase failed'); return; }
      await loadState(); stopTimer(); go('home'); toast('Erased'); },
};

/* one permanent listener; buttons can never go stale */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-a]');
  if(!t) return;
  const fn=ACTIONS[t.dataset.a];
  if(!fn) return;
  try{ const r=fn(t,ev); if(r&&r.catch) r.catch(err=>{console.error(err);toast('Error — data is safe');}); }
  catch(err){ console.error(err); toast('Error — data is safe'); }
});

/* static bindings — these elements exist once, in the shell */
document.querySelectorAll('nav button').forEach(b=>{b.dataset.a='nav';});
document.querySelectorAll('#p-seg button').forEach(b=>b.addEventListener('click',()=>{
  progDay=b.dataset.day;
  document.querySelectorAll('#p-seg button').forEach(x=>x.classList.toggle('on',x===b));
  guard('prog',renderProgram);
}));
document.querySelectorAll('#hi-seg button').forEach(b=>b.addEventListener('click',()=>{
  histFilter=b.dataset.f;
  document.querySelectorAll('#hi-seg button').forEach(x=>x.classList.toggle('on',x===b));
  guard('hist',renderHistory);
}));
el('timer-skip').addEventListener('click',stopTimer);
el('timer-add').addEventListener('click',()=>{
  timerEnd+=30000; timerTotal+=30; kvSet('timer',{end:timerEnd,total:timerTotal}); tickTimer();
});
el('scrim').addEventListener('click',hideSheet);
document.addEventListener('change',ev=>{
  if(ev.target.id!=='file') return;
  const f=ev.target.files[0]; if(!f) return;
  f.text().then(txt=>{
    const d=JSON.parse(txt);
    if(!confirm('Import will merge into your current data. Continue?')) return;
    return (async()=>{
      for(const s of (d.sessions||[])) await putSession(s);
      for(const w of (d.body_weights||[])) await putWeight(w);
      if(d.slot_pins) await kvSet('pins',d.slot_pins);
      if(d.deload_weeks) await kvSet('deloads',d.deload_weeks);
      await loadState(); go('home'); toast('Imported');
    })();
  }).catch(()=>toast('Could not read that file'))
    .finally(()=>{ ev.target.value=''; });
});

/* ---------- 11. BOOT ---------- */
async function loadState(){
  const [sessions,weights,settings,pins,deloads,active,timer]=await Promise.all([
    allSessions(), allWeights(),
    kvGet('settings',{sound:true,haptic:true}),
    kvGet('pins',{}), kvGet('deloads',[]),
    kvGet('active',null), kvGet('timer',null),
  ]);
  const fix=e=>{ e.logged=Array.isArray(e.logged)
    ? Array.from(e.logged,x=>(x&&typeof x.weight==='number'&&typeof x.reps==='number')?x:null)
    : []; return e; };
  sessions.forEach(s=>{ if(Array.isArray(s.exercises)) s.exercises.forEach(fix); });
  if(active&&Array.isArray(active.exercises)) active.exercises.forEach(fix);
  ST.sessions=sessions.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  ST.weights=weights||[];
  ST.settings=settings; ST.pins=pins||{}; ST.deloads=deloads||[];
  ST.active=active||null;
  if(timer&&timer.end>Date.now()){
    timerEnd=timer.end; timerTotal=timer.total;
    el('timer').classList.add('on'); document.body.classList.add('timer-on');
    tickTimer(); clearInterval(timerInt); timerInt=setInterval(tickTimer,250);
  }
}
(async function init(){
  try{
    await openDB();
    await loadState();
    go('home');
  }catch(e){
    document.body.innerHTML='<div class="empty" style="padding-top:80px"><p>'+
      'Storage unavailable. If you are in Private Browsing, switch to a normal tab.</p></div>';
    console.error(e);
  }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
})();
</script>
